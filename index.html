<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071c24"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Vietnam"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Vietnam Countdown 🇻🇳</title><style>
:root{--cream:#fff5df;--gold:#f8c85b;--green:#35c28b;--muted:#b9d5d4}*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;color:white;background:radial-gradient(circle at 70% 0,#16505a 0,transparent 35%),linear-gradient(160deg,#071c24,#0b2c31 58%,#10211e);overflow-x:hidden}.wrap{max-width:760px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));min-height:100svh;display:flex;flex-direction:column}.top{text-align:center}.flag{font-size:42px;filter:drop-shadow(0 6px 12px #0006)}h1{margin:6px 0 0;font-size:clamp(38px,11vw,72px);letter-spacing:-2px}.sub{color:var(--muted);font-weight:650;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.hero{margin:25px 0 18px;padding:26px 16px;border:1px solid #ffffff22;border-radius:28px;background:linear-gradient(145deg,#ffffff13,#ffffff08);box-shadow:0 24px 60px #0005;backdrop-filter:blur(16px)}.until{text-align:center;color:var(--cream);font-size:14px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.num{font-size:clamp(30px,9vw,55px);font-weight:800;line-height:1}.unit{font-size:10px;text-transform:uppercase;color:var(--muted);margin-top:7px;letter-spacing:.08em}.cell{text-align:center}.quote{text-align:center;font-family:Georgia,serif;font-style:italic;font-size:20px;line-height:1.4;color:var(--cream);margin:20px auto 6px;max-width:590px}.route{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px 0;color:#dcebea;font-weight:650}.line{height:1px;flex:1;min-width:20px;max-width:60px;background:#ffffff35}.card{margin-top:10px;padding:18px;border-radius:22px;background:#06171bb8;border:1px solid #ffffff18}.card h2{margin:0 0 13px;font-size:17px}.milestones{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.pill{min-width:108px;padding:12px;border-radius:16px;background:#ffffff0c;border:1px solid #ffffff17}.pill.done{opacity:.42}.pill.active{border-color:var(--gold);box-shadow:0 0 0 1px #f8c85b55 inset}.pill b{display:block;font-size:18px;color:var(--gold)}.pill span{font-size:11px;color:var(--muted)}.footer{margin-top:auto;padding-top:22px;text-align:center;color:#86aaa9;font-size:11px}.palms{position:fixed;bottom:-16px;left:-10px;font-size:80px;opacity:.08;transform:rotate(-8deg);pointer-events:none}.sun{position:fixed;width:180px;height:180px;border-radius:50%;right:-90px;bottom:15%;background:#f7c85a14;box-shadow:0 0 90px #f7c85a20;pointer-events:none}@media(max-width:420px){.hero{padding:24px 9px}.grid{gap:2px}}
</style></head><body><div class="sun"></div><div class="palms">🌴</div><main class="wrap"><div class="top"><div class="flag">🇻🇳</div><div class="sub">The boys are going to Vietnam</div><h1>VIETNAM</h1></div><section class="hero"><div class="until">Noch bis zum Abflug · 18. November 2026 · 14:45</div><div class="grid"><div class="cell"><div class="num" id="d">--</div><div class="unit">Tage</div></div><div class="cell"><div class="num" id="h">--</div><div class="unit">Stunden</div></div><div class="cell"><div class="num" id="m">--</div><div class="unit">Minuten</div></div><div class="cell"><div class="num" id="s">--</div><div class="unit">Sekunden</div></div></div></section><div class="quote" id="quote"></div><div class="route"><span>🇩🇪 Düsseldorf</span><span class="line"></span><span>✈️</span><span class="line"></span><span>🌆 Saigon</span><span>→</span><span>🏝️ Phú Quốc</span></div><section class="card"><h2>🏁 Road to Vietnam</h2><div class="milestones" id="milestones"></div></section><div class="footer">BEST FRIENDS · BIG CITY · ISLAND LIFE · 2026</div></main><script>
const target=new Date('2026-11-18T14:45:00+01:00');
const quotes=["Noch ein Tag näher an Streetfood, Palmen und Chaos. 🇻🇳","Saigon lights. Phú Quốc nights. We’re getting closer.","Arbeiten ist temporär. Vietnam-Erinnerungen bleiben. 😎","Bald heißt das größte Problem: Pho oder Bánh mì?","Zwei Freunde. Ein Abenteuer. Viel zu wenig Schlaf. ✈️","Der Countdown läuft – Vietnam wartet nicht. 🌴","Vorfreude ist schon die erste Etappe der Reise.","Bald tauschen wir Alltag gegen Roller, Rooftops und Meer.","Noch ein bisschen durchhalten. Dann: Xin chào Vietnam!","Das nächste große Kapitel beginnt am Gate. ✈️"];
function dailyQuote(){const start=new Date(2026,0,1);const now=new Date();const day=Math.floor((now-start)/86400000);document.getElementById('quote').textContent='“'+quotes[Math.abs(day)%quotes.length]+'”'}
const ms=[50,30,14,7,3,1];function drawMilestones(days){let next=ms.filter(x=>days>x).sort((a,b)=>a-b)[0];document.getElementById('milestones').innerHTML=ms.map(x=>`<div class="pill ${days<x?'done':''} ${x===next?'active':''}"><b>${x} Tage</b><span>${days<x?'✓ erreicht':'bis zum Abflug'}</span></div>`).join('')}
function tick(){let diff=target-new Date();if(diff<=0){document.querySelector('.hero').innerHTML='<div style="text-align:center;font-size:34px;font-weight:800">VIETNAM TIME! 🇻🇳✈️🌴</div>';return}let d=Math.floor(diff/86400000);diff%=86400000;let h=Math.floor(diff/3600000);diff%=3600000;let m=Math.floor(diff/60000);let s=Math.floor((diff%60000)/1000);for(const [id,v] of [['d',d],['h',h],['m',m],['s',s]])document.getElementById(id).textContent=String(v).padStart(2,'0');drawMilestones(d)}dailyQuote();tick();setInterval(tick,1000);
</script></body></html>
